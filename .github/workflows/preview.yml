name: preview

# PR の内容を stg プロジェクトのプレビューチャネル（pr-<番号>）にデプロイし、URL を PR にコメントする。

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/actions/deploy/**"
      - ".github/workflows/preview.yml"

permissions:
  contents: read

jobs:
  preview:
    name: preview
    # fork からの PR は OIDC トークンを取得できないためスキップする
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check variables
        env:
          STG_PROJECT_ID: ${{ vars.STG_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          missing=()
          for name in STG_PROJECT_ID GCP_WIF_PROVIDER; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "::error::GitHub Variables が未設定です（${missing[*]}）。docs/setup.md の手順 3-2 を確認してください。"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "value=pr-${PR_NUMBER}-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy to preview channel
        id: deploy
        uses: ./.github/actions/deploy
        with:
          app-env: preview
          app-version: ${{ steps.version.outputs.value }}
          commit-sha: ${{ github.event.pull_request.head.sha }}
          project-id: ${{ vars.STG_PROJECT_ID }}
          # stg の deployer SA（account_id は Terraform で "deployer" に固定）。PR のジョブは Environment を使わないため、ここで組み立てる
          service-account: deployer@${{ vars.STG_PROJECT_ID }}.iam.gserviceaccount.com
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          channel: pr-${{ github.event.pull_request.number }}
          expires: 7d

      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { PREVIEW_URL: url, HEAD_SHA: sha } = process.env;
            const marker = "<!-- preview-url -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "### 🔍 プレビュー",
              "",
              `**${url}**`,
              "",
              `コミット: ${sha} ／ 有効期限: 7 日（PR を更新すると延長） ／ [ワークフローの実行](${runUrl})`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.type === "Bot" && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
