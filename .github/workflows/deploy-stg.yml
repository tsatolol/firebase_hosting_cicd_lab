name: deploy-stg

# main への push で、stg の live チャネルにデプロイする。

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/actions/deploy/**"
      - ".github/workflows/deploy-stg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint / test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    name: deploy (stg)
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: stg
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    # 同時に走らせない。進行中のデプロイはキャンセルせず、終わるのを待つ
    concurrency:
      group: deploy-stg
      cancel-in-progress: false
    steps:
      - name: Check variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DEPLOY_SA: ${{ vars.DEPLOY_SA }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          missing=()
          for name in GCP_PROJECT_ID DEPLOY_SA GCP_WIF_PROVIDER; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "::error::GitHub Variables が未設定です（${missing[*]}）。docs/setup.md の手順 3-2 と 4 を確認してください。"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: echo "value=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy
        with:
          app-env: stg
          app-version: ${{ steps.version.outputs.value }}
          commit-sha: ${{ github.sha }}
          project-id: ${{ vars.GCP_PROJECT_ID }}
          service-account: ${{ vars.DEPLOY_SA }}
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
